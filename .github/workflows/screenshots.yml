name: Real SCADA screenshots
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/screenshots/*.png"
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify browser controls and capture
        run: npm run screenshots
      - name: Upload screenshots for review
        uses: actions/upload-artifact@v4
        with:
          name: real-scada-chromium-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Publish real screenshots on main
        if: github.event_name != 'pull_request'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add docs/screenshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh real Chromium SCADA screenshots [skip ci]"
            git push
          fi
